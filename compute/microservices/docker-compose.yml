# Versi MICROSERVICES: frontend (nginx) dan API (Python) di container terpisah.
# Jalankan dari folder ini:  docker compose up -d   ->  http://<IP_VM>
services:
  api:
    image: python:3.12-alpine
    command: ["python", "/app/app.py"]
    environment:
      MODE: api
      DATA_DIR: /data
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../../app:/app:ro
      - api-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "80:8080"
    volumes:
      - ../../app/static:/usr/share/nginx/html:ro
      - ../../app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  api-data:
