# nginx (frontend) untuk versi microservices.
# Menyajikan halaman web dan meneruskan /api/ ke service "api" di port 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Web-Pod $hostname always;
    }

    location / {
        try_files $uri /index.html;
    }
}
