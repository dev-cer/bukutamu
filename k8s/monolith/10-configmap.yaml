# File ini di-generate oleh scripts/gen_k8s.py dari folder app/. Jangan edit manual.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-code
  namespace: buku-tamu-mono
  labels:
    app.kubernetes.io/part-of: buku-tamu-civo
data:
  app.py: |
    #!/usr/bin/env python3
    """Buku Tamu Civo — contoh aplikasi untuk onboarding Civo Compute & Civo Kubernetes.

    Hanya memakai Python standard library (tanpa pip install), jadi bisa langsung jalan
    dengan image resmi python:3.12-alpine.

    MODE=monolith  -> satu proses melayani halaman web (/) dan API (/api/...)
    MODE=api       -> hanya API; halaman web dilayani terpisah oleh nginx (microservices)
    """
    import json
    import os
    import socket
    import sqlite3
    import threading
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    MODE = os.environ.get("MODE", "monolith")
    PORT = int(os.environ.get("PORT", "8080"))
    DATA_DIR = os.environ.get("DATA_DIR", "/data")
    STATIC_DIR = os.environ.get("STATIC_DIR", os.path.join(os.path.dirname(os.path.abspath(__file__)), "static"))
    VERSION = "1.0.0"
    HOSTNAME = socket.gethostname()
    DB_PATH = os.path.join(DATA_DIR, "bukutamu.db")
    LOCK = threading.Lock()


    def db():
        conn = sqlite3.connect(DB_PATH, timeout=10)
        conn.row_factory = sqlite3.Row
        return conn


    def init_db():
        os.makedirs(DATA_DIR, exist_ok=True)
        with LOCK, db() as conn:
            conn.execute(
                "CREATE TABLE IF NOT EXISTS entries ("
                "id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, city TEXT, "
                "message TEXT, served_by TEXT, created_at TEXT NOT NULL)"
            )


    class Handler(BaseHTTPRequestHandler):
        server_version = "BukuTamuCivo/" + VERSION

        def log_message(self, fmt, *args):  # log ringkas ke stdout (terlihat di docker logs / kubectl logs)
            print(f"{self.address_string()} {self.command} {self.path} -> {fmt % args}", flush=True)

        def send_json(self, code, payload):
            body = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.send_header("X-Served-By", HOSTNAME)
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            path = self.path.split("?")[0]
            if path == "/healthz":
                return self.send_json(200, {"status": "ok"})
            if path == "/api/info":
                return self.send_json(200, {"app": "buku-tamu-civo", "mode": MODE, "version": VERSION, "hostname": HOSTNAME})
            if path == "/api/entries":
                with db() as conn:
                    rows = conn.execute("SELECT * FROM entries ORDER BY id DESC LIMIT 50").fetchall()
                return self.send_json(200, {"served_by": HOSTNAME, "mode": MODE, "entries": [dict(r) for r in rows]})
            if MODE == "monolith" and path in ("/", "/index.html"):
                with open(os.path.join(STATIC_DIR, "index.html"), "rb") as f:
                    body = f.read()
                self.send_response(200)
                self.send_header("Content-Type", "text/html; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                return self.wfile.write(body)
            return self.send_json(404, {"error": "not found"})

        def do_POST(self):
            if self.path.split("?")[0] != "/api/entries":
                return self.send_json(404, {"error": "not found"})
            try:
                length = min(int(self.headers.get("Content-Length", "0")), 10_000)
                data = json.loads(self.rfile.read(length) or b"{}")
            except (ValueError, json.JSONDecodeError):
                return self.send_json(400, {"error": "body harus JSON"})
            name = str(data.get("name", "")).strip()[:60]
            if not name:
                return self.send_json(400, {"error": "nama wajib diisi"})
            city = str(data.get("city", "")).strip()[:60]
            message = str(data.get("message", "")).strip()[:280]
            now = datetime.now(timezone.utc).isoformat(timespec="seconds")
            with LOCK, db() as conn:
                cur = conn.execute(
                    "INSERT INTO entries (name, city, message, served_by, created_at) VALUES (?,?,?,?,?)",
                    (name, city, message, HOSTNAME, now),
                )
            return self.send_json(201, {"id": cur.lastrowid, "served_by": HOSTNAME})


    if __name__ == "__main__":
        init_db()
        print(f"Buku Tamu Civo v{VERSION} | mode={MODE} | port={PORT} | data={DB_PATH} | host={HOSTNAME}", flush=True)
        ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
  index.html: |
    <!DOCTYPE html>
    <html lang="id">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buku Tamu Civo</title>
    <style>
      :root { --cloud:#D1CCBE; --cloud-lt:#ECE9E1; --ink:#000; --aurora:#00FF6F; --public:#D46FFE; --muted:#4A4842; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--cloud); color: var(--ink); }
      main { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; }
      h1 { font-family: Georgia, serif; font-weight: 300; font-size: 40px; margin: 0 0 4px; }
      p.sub { color: var(--muted); margin: 0 0 24px; }
      .info { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
      .chip { background:#000; color:#fff; border-radius:999px; padding:6px 14px; font-size:13px; }
      .chip b { color: var(--aurora); font-weight:600; }
      form, .list { background: var(--cloud-lt); border-radius:14px; padding:20px; }
      form { display:grid; gap:10px; grid-template-columns: 1fr 1fr; margin-bottom:20px; }
      form textarea, form button { grid-column: 1 / -1; }
      input, textarea { width:100%; padding:10px 12px; border:1px solid #bdb7a7; border-radius:10px; font: inherit; background:#fff; }
      button { background: var(--aurora); border:0; border-radius:999px; padding:12px; font: inherit; font-weight:600; cursor:pointer; }
      .entry { border-bottom:1px solid #d6d1c4; padding:12px 0; }
      .entry:last-child { border-bottom:0; }
      .entry .meta { color: var(--muted); font-size: 13px; }
      .err { color:#9C0006; }
      @media (max-width: 560px) { form { grid-template-columns: 1fr; } h1 { font-size: 32px; } }
    </style>
    </head>
    <body>
    <main>
      <h1>Buku Tamu Civo</h1>
      <p class="sub">Contoh aplikasi onboarding: deploy ke Civo Compute dan Civo Kubernetes.</p>
      <div class="info">
        <span class="chip">Mode: <b id="mode">-</b></span>
        <span class="chip">API dilayani oleh: <b id="api-pod">-</b></span>
        <span class="chip">Web dilayani oleh: <b id="web-pod">-</b></span>
      </div>
      <form id="f">
        <input name="name" placeholder="Nama" maxlength="60" required>
        <input name="city" placeholder="Kota / perusahaan" maxlength="60">
        <textarea name="message" rows="2" placeholder="Pesan singkat (opsional)" maxlength="280"></textarea>
        <button type="submit">Isi buku tamu</button>
      </form>
      <div class="list" id="list">Memuat...</div>
    </main>
    <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    async function load() {
      const list = document.getElementById("list");
      try {
        const res = await fetch("/api/entries", { cache: "no-store" });
        const data = await res.json();
        document.getElementById("mode").textContent = data.mode === "api" ? "microservices" : data.mode;
        document.getElementById("api-pod").textContent = data.served_by;
        document.getElementById("web-pod").textContent = res.headers.get("X-Web-Pod") || "(sama dengan API)";
        list.innerHTML = data.entries.length ? data.entries.map((e) =>
          `<div class="entry"><b>${esc(e.name)}</b>${e.city ? " · " + esc(e.city) : ""}<div>${esc(e.message)}</div>` +
          `<div class="meta">${esc(e.created_at)} · dicatat oleh ${esc(e.served_by)}</div></div>`).join("") : "Belum ada tamu. Jadilah yang pertama!";
      } catch (err) {
        list.innerHTML = `<span class="err">Gagal memanggil API: ${esc(err.message)}</span>`;
      }
    }
    document.getElementById("f").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const body = Object.fromEntries(new FormData(ev.target));
      const res = await fetch("/api/entries", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (res.ok) { ev.target.reset(); load(); } else { alert((await res.json()).error || "Gagal menyimpan"); }
    });
    load();
    setInterval(load, 5000);
    </script>
    </body>
    </html>
